<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title><PROJECT_NAME> Autonomous Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f5;
      --ink: #17201b;
      --muted: #607067;
      --panel: #ffffff;
      --line: #dbe2dc;
      --accent: #006d77;
      --warn: #b54708;
      --bad: #b42318;
      --good: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    header, main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    header { padding-top: 28px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 5vw, 48px); letter-spacing: 0; }
    h2 { font-size: 20px; margin-bottom: 12px; }
    h3 { font-size: 15px; margin-bottom: 8px; }
    .subhead { color: var(--muted); margin-top: 8px; max-width: 760px; }
    .grid { display: grid; gap: 16px; }
    .summary { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 24px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(23, 32, 27, .04);
    }
    .metric { font-size: 30px; font-weight: 700; }
    .label, .meta { color: var(--muted); font-size: 13px; }
    .cols { grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); align-items: start; }
    .lane, .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      background: #fbfcfa;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e9f3f4;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status.blocked { background: #fff4ed; color: var(--warn); }
    .status.done { background: #ecfdf3; color: var(--good); }
    .status.failed_validation, .status.conflicted { background: #fef3f2; color: var(--bad); }
    dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 10px; margin: 10px 0 0; }
    dt { color: var(--muted); font-size: 13px; }
    dd { margin: 0; overflow-wrap: anywhere; }
    ul { margin: 10px 0 0; padding-left: 20px; }
    @media (max-width: 820px) {
      header, main { padding: 18px; }
      .cols { grid-template-columns: 1fr; }
      dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="project-name"><PROJECT_NAME></h1>
    <p class="subhead" id="project-purpose"><PROJECT_PURPOSE></p>
    <section class="grid summary" aria-label="Status summary">
      <div class="panel"><div class="metric" id="todo-count">0</div><div class="label">Todo</div></div>
      <div class="panel"><div class="metric" id="active-count">0</div><div class="label">In progress</div></div>
      <div class="panel"><div class="metric" id="blocked-count">0</div><div class="label">Blocked</div></div>
      <div class="panel"><div class="metric" id="done-count">0</div><div class="label">Done</div></div>
      <div class="panel"><div class="metric" id="lane-count">0</div><div class="label">Active lanes</div></div>
    </section>
  </header>
  <main class="grid cols">
    <section class="panel">
      <h2>Current Sprint</h2>
      <div id="lanes"></div>
    </section>
    <aside class="grid">
      <section class="panel">
        <h2>Roadmap</h2>
        <p class="meta" id="milestone"></p>
        <ul id="backlog"></ul>
      </section>
      <section class="panel">
        <h2>Blocked</h2>
        <div id="blocked"></div>
      </section>
      <section class="panel">
        <h2>Next</h2>
        <p id="next-action"></p>
      </section>
    </aside>
  </main>
  <script type="application/json" id="dashboard-data">
    __DASHBOARD_DATA_JSON__
  </script>
  <script>
    const fallback = {
      project: { name: "<PROJECT_NAME>", purpose: "<PROJECT_PURPOSE>" },
      summary: {},
      roadmap: { next_backlog_seeds: [] },
      active_lanes: [],
      work_items: [],
      blocked: [],
      last_run: {}
    };
    let data = fallback;
    try {
      const embedded = document.getElementById("dashboard-data").textContent.trim();
      if (embedded && !embedded.includes("__DASHBOARD_DATA_JSON__")) data = JSON.parse(embedded);
    } catch (error) {
      data = fallback;
    }
    const byId = (id) => document.getElementById(id);
    const text = (id, value) => { byId(id).textContent = value ?? ""; };
    const summary = data.summary || {};
    text("project-name", data.project?.name || "<PROJECT_NAME>");
    text("project-purpose", data.project?.purpose || "<PROJECT_PURPOSE>");
    text("todo-count", summary.todo || 0);
    text("active-count", summary.in_progress || 0);
    text("blocked-count", summary.blocked || 0);
    text("done-count", summary.done || 0);
    text("lane-count", summary.active_parallel_lanes || 0);
    text("milestone", data.roadmap?.current_milestone || data.project?.phase || "");
    text("next-action", summary.next_action || data.last_run?.next_action || "");

    function renderItem(item) {
      const status = item.dispatch_status || item.status || "unknown";
      return `<article class="lane">
        <h3>${item.key || "work-item"}: ${item.title || ""}</h3>
        <span class="status ${status}">${status}</span>
        <dl>
          <dt>Subagent</dt><dd>${item.assigned_subagent || "main run"}</dd>
          <dt>Branch</dt><dd>${item.branch || "not claimed"}</dd>
          <dt>Worktree</dt><dd>${item.worktree || "not created"}</dd>
          <dt>Validation</dt><dd>${(item.validation || []).join("; ") || "not run"}</dd>
          <dt>Next step</dt><dd>${item.next_step || ""}</dd>
        </dl>
      </article>`;
    }

    const lanes = data.active_lanes?.length ? data.active_lanes : (data.work_items || []).filter((item) => item.status === "in_progress");
    byId("lanes").innerHTML = lanes.length ? lanes.map(renderItem).join("") : "<p class=\"meta\">No active lanes.</p>";
    const blocked = data.blocked?.length ? data.blocked : (data.work_items || []).filter((item) => item.status === "blocked");
    byId("blocked").innerHTML = blocked.length ? blocked.map(renderItem).join("") : "<p class=\"meta\">No blocked work.</p>";
    byId("backlog").innerHTML = (data.roadmap?.next_backlog_seeds || []).map((seed) => `<li>${seed}</li>`).join("");
  </script>
</body>
</html>
