<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title><PROJECT_NAME> Live Lambchop Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f5;
      --ink: #17201b;
      --muted: #607067;
      --panel: #ffffff;
      --line: #dbe2dc;
      --accent: #006d77;
      --warn: #b54708;
      --bad: #b42318;
      --good: #067647;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.45; }
    header, main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    header { padding-top: 28px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 5vw, 48px); letter-spacing: 0; }
    h2 { font-size: 20px; margin-bottom: 12px; }
    h3 { font-size: 15px; margin-bottom: 8px; }
    .subhead, .meta { color: var(--muted); }
    .subhead { margin-top: 8px; max-width: 760px; }
    .grid { display: grid; gap: 16px; }
    .summary { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 24px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(23, 32, 27, .04); }
    .metric { font-size: 30px; font-weight: 700; }
    .label, .meta { font-size: 13px; }
    .cols { grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); align-items: start; }
    .lane { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; background: #fbfcfa; }
    .status { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 8px; border-radius: 999px; background: #e9f3f4; color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status.blocked { background: #fff4ed; color: var(--warn); }
    .status.done { background: #ecfdf3; color: var(--good); }
    .status.failed_validation, .status.conflicted { background: #fef3f2; color: var(--bad); }
    dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 10px; margin: 10px 0 0; }
    dt { color: var(--muted); font-size: 13px; }
    dd { margin: 0; overflow-wrap: anywhere; }
    ul { margin: 10px 0 0; padding-left: 20px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; color: var(--muted); font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    @media (max-width: 820px) { header, main { padding: 18px; } .cols { grid-template-columns: 1fr; } dl { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1 id="project-name">Loading Lambchop status...</h1>
    <p class="subhead" id="project-purpose">Waiting for live workflow data.</p>
    <p class="meta" id="refresh-status">Connecting to live status server...</p>
    <section class="grid summary" aria-label="Status summary">
      <div class="panel"><div class="metric" id="todo-count">0</div><div class="label">Todo</div></div>
      <div class="panel"><div class="metric" id="active-count">0</div><div class="label">In progress</div></div>
      <div class="panel"><div class="metric" id="blocked-count">0</div><div class="label">Blocked</div></div>
      <div class="panel"><div class="metric" id="done-count">0</div><div class="label">Done</div></div>
      <div class="panel"><div class="metric" id="lane-count">0</div><div class="label">Active lanes</div></div>
    </section>
  </header>
  <main class="grid cols">
    <section class="panel">
      <h2>Current Run</h2>
      <div id="current-run" class="lane"><p class="meta">Waiting for run data.</p></div>
      <h2 style="margin-top: 18px;">Active Lanes</h2>
      <div id="lanes"><p class="meta">No active lanes.</p></div>
      <h2 style="margin-top: 18px;">Latest Work</h2>
      <div id="latest-work"></div>
    </section>
    <aside class="grid">
      <section class="panel">
        <h2>Roadmap</h2>
        <p class="meta" id="milestone"></p>
        <ul id="backlog"></ul>
      </section>
      <section class="panel">
        <h2>Blocked</h2>
        <div id="blocked"></div>
      </section>
      <section class="panel">
        <h2>Next</h2>
        <p id="next-action"></p>
      </section>
      <section class="panel">
        <h2>Progress Tail</h2>
        <pre id="progress-tail"></pre>
      </section>
    </aside>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    const text = (id, value) => { byId(id).textContent = value ?? ""; };
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch]));
    function renderItem(item) {
      const status = item.dispatch_status || item.status || "unknown";
      return `<article class="lane">
        <h3>${escapeHtml(item.key || "work-item")}: ${escapeHtml(item.title || "")}</h3>
        <span class="status ${escapeHtml(item.status || status)}">${escapeHtml(status)}</span>
        <dl>
          <dt>Subagent</dt><dd>${escapeHtml(item.assigned_subagent || "main run")}</dd>
          <dt>Branch</dt><dd>${escapeHtml(item.branch || "not claimed")}</dd>
          <dt>Worktree</dt><dd>${escapeHtml(item.worktree || "not created")}</dd>
          <dt>Validation</dt><dd>${escapeHtml((item.validation || []).join("; ") || "not run")}</dd>
          <dt>Next step</dt><dd>${escapeHtml(item.next_step || "")}</dd>
        </dl>
      </article>`;
    }
    function renderRun(run) {
      if (!run) return `<p class="meta">No run data yet.</p>`;
      return `<dl>
        <dt>Run id</dt><dd>${escapeHtml(run.run_id || "not recorded")}</dd>
        <dt>Started</dt><dd>${escapeHtml(run.started_at || run.timestamp || "not recorded")}</dd>
        <dt>Work item</dt><dd>${escapeHtml(run.work_item_key || run.active_work_item || "not recorded")}</dd>
        <dt>Dashboard</dt><dd>${escapeHtml(run.dashboard_updated_at || "live")}</dd>
      </dl>`;
    }
    async function refresh() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error(`status ${response.status}`);
        const data = await response.json();
        const summary = data.summary || {};
        text("project-name", data.project?.name || "Lambchop project");
        text("project-purpose", data.project?.purpose || "");
        text("refresh-status", `Live as of ${data.generated_at || new Date().toISOString()}`);
        text("todo-count", summary.todo || 0);
        text("active-count", summary.in_progress || 0);
        text("blocked-count", summary.blocked || 0);
        text("done-count", summary.done || 0);
        text("lane-count", summary.active_parallel_lanes || 0);
        text("milestone", data.roadmap?.current_milestone || data.project?.phase || "");
        text("next-action", summary.next_action || "");
        byId("current-run").innerHTML = renderRun(data.current_run);
        byId("lanes").innerHTML = data.active_lanes?.length ? data.active_lanes.map(renderItem).join("") : `<p class="meta">No active lanes.</p>`;
        byId("latest-work").innerHTML = data.latest_work_items?.length ? data.latest_work_items.map(renderItem).join("") : `<p class="meta">No work items yet.</p>`;
        byId("blocked").innerHTML = data.blocked?.length ? data.blocked.map(renderItem).join("") : `<p class="meta">No blocked work.</p>`;
        byId("backlog").innerHTML = (data.roadmap?.next_backlog_seeds || []).map((seed) => `<li>${escapeHtml(seed.replace(/^- /, ""))}</li>`).join("");
        text("progress-tail", (data.progress_tail || []).join("\n"));
      } catch (error) {
        text("refresh-status", `Live status unavailable: ${error.message}`);
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
